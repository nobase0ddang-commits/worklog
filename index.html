<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#bd1d63">
<title>CH Messenger</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Malgun Gothic","맑은 고딕",system-ui,-apple-system,sans-serif;font-size:13px;color:#222;background:#fff;overflow:hidden}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea,select{font:inherit;color:inherit}
#app{height:100%}
.hidden{display:none!important}
.ic{width:28px;height:28px;border-radius:6px;display:inline-grid;place-items:center;font-size:15px;opacity:.75}
.ic:hover{background:rgba(0,0,0,.07);opacity:1}
.back{display:none}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#aaa;vertical-align:middle}
.dot.on{background:#2fb35a}.dot.off{background:#d9534f}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#e5483f;color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center}
.txt{white-space:pre-wrap;word-break:break-word}
.empty{color:#999;text-align:center;padding:40px 16px;line-height:1.7}

/* ---------- 메신저형 (CH) ---------- */
.ch{--pk:#bd1d63;--sel:#dde3f7;--line:#e4e4e8;--av:#86c6d8;display:flex;height:100%;background:#fff;color:#222}
.ch svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ch .av{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--av);color:#fff;font-size:15px;font-weight:600}
.ch .av.grp{background:none;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;place-items:stretch;gap:2px;padding:1px}
.ch .av.grp i{border-radius:50%;background:var(--av);display:grid;place-items:center;font-style:normal;font-size:9px;color:#fff}
.ch-main{width:430px;flex:none;display:flex;flex-direction:column;border-right:1px solid #d9d9de;min-width:0}
.ch-tool{height:58px;flex:none;display:flex;align-items:center;gap:18px;padding:0 14px 0 16px;border-bottom:1px solid #e1e1e6;color:var(--pk)}
.ch-tool .t{width:32px;height:32px;position:relative;cursor:pointer}
.ch-tool .t .badge{position:absolute;top:-6px;right:-10px;transform:scale(.85)}
.ch-tool .sp{flex:1}
.ch-tool .bell{width:34px;height:34px;border-radius:50%;background:#ececf0;color:#9a9aa3;padding:7px}
.ch-body{flex:1;display:flex;min-height:0}
.ch-rail{width:50px;flex:none;border-right:1px solid #e1e1e6;display:flex;flex-direction:column;align-items:center;gap:22px;padding-top:16px;color:var(--pk)}
.ch-rail .r{width:26px;height:26px;cursor:pointer}
.ch-pane{flex:1;display:flex;flex-direction:column;min-width:0;background:#fff}
.ch-search{height:40px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px 0 12px;border-bottom:1px solid #e1e1e6;color:#999}
.ch-search .mg{width:16px;height:16px;flex:none}
.ch-search span.ph{flex:1;font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ch-search .s{width:18px;height:18px;color:#777;flex:none}
.ch-tabs{height:40px;flex:none;display:flex;align-items:flex-end;gap:2px;padding:0 10px}
.ch-tabs span{padding:0 7px 9px;font-size:13px;color:#333;border-bottom:2px solid transparent;cursor:pointer}
.ch-tabs span.on{color:#4b4f9c;border-color:#5e63b6;font-weight:600}
.ch-tabs .chev{width:16px;height:16px;margin:0 0 9px 8px;color:#555}
.ch-list{flex:1;overflow:auto;list-style:none}
.ch-list li{display:flex;gap:12px;padding:9px 14px 8px 18px;cursor:pointer;position:relative}
.ch-list li::after{content:"";position:absolute;left:18px;right:16px;bottom:0;height:1px;background:var(--line)}
.ch-list li:hover{background:#f3f4fa}
.ch-list li.on{background:var(--sel)}
.ch-list .av{margin-top:2px}
.ch-list .meta{flex:1;min-width:0;line-height:1.55}
.ch-list .l1{display:flex;align-items:baseline;gap:10px}
.ch-list .l1 b{font-size:13.5px;font-weight:700;white-space:nowrap}
.ch-list .l1 small{color:#888;font-size:11.5px;font-weight:600;white-space:nowrap}
.ch-list .l1 .badge{margin-left:auto}
.ch-list .l2,.ch-list .l3{font-size:12.5px;color:#222;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ch-list .l2 .cl,.ch-list .l2 .ps{display:inline-block;width:15px;height:15px;vertical-align:-3px;margin-right:4px;color:#555}
.ch-list .l2 .ps{color:#4b6fd0}
.ch-chat{flex:1;display:flex;flex-direction:column;min-width:0;background:#f3f3f3}
.ch-head{flex:none;background:#f6f6f6;border-bottom:1px solid #dcdcdc;padding:8px 12px 6px 14px}
.ch-head .r1{display:flex;align-items:center;gap:12px}
.ch-head .r1 .av{width:44px;height:44px;font-size:17px}
.ch-head .hi{width:20px;height:20px;color:#555}
.ch-head .r2{display:flex;align-items:center;gap:6px;margin:2px 0 0 4px;font-size:13px}
.ch-head .r2 .av{width:18px;height:18px;font-size:9px}
.ch-head .r2 .sp{flex:1}
.ch-head .r2 .cb{width:24px;height:24px;border-radius:50%;background:#e2e2e6;color:#666;padding:5px}
.ch-head .back{width:22px;height:22px;color:#555;cursor:pointer}
.ch-msgs{flex:1;overflow:auto;padding:6px 12px 10px}
.ch-day{display:flex;align-items:center;margin:12px -4px;font-size:12px;color:#333}
.ch-day::before,.ch-day::after{content:"";flex:1;height:1px;background:#c9c9c9}
.ch-day span{background:#d9d9d9;border:1px solid #c4c4c4;padding:1px 6px}
.ch-o{display:flex;gap:9px;margin-top:10px}
.ch-o .av{width:36px;height:36px;font-size:14px}
.ch-o .nm{font-size:13px;color:#333;margin:1px 0 5px}
.ch-o .row{display:flex;align-items:flex-end;gap:6px;margin-bottom:6px}
.ch-bub{max-width:min(420px,64vw);padding:7px 11px;font-size:13px;line-height:1.5;border:1px solid #cfcfcf;background:#ececec;border-radius:2px;position:relative}
.ch-o .nm + .row .ch-bub::before{content:"";position:absolute;left:-6px;top:6px;border:5px solid transparent;border-right-color:#cfcfcf;border-left:0}
.ch-m{display:flex;justify-content:flex-end;align-items:flex-end;gap:6px;margin:6px 0}
.ch-m .ch-bub{background:#f6d61c;border-color:#d9b70b}
.ch-m.first .ch-bub::after{content:"";position:absolute;right:-6px;top:6px;border:5px solid transparent;border-left-color:#d9b70b;border-right:0}
.ch-o time,.ch-m time{font-size:11px;color:#555;white-space:nowrap}
.ch-comp{flex:none;background:#fff;border-top:1px solid #d6d6d6}
.ch-grip{height:6px;display:grid;place-items:center}
.ch-grip::before{content:"";width:14px;height:3px;border-top:1px solid #aaa;border-bottom:1px solid #aaa}
.ch-comp textarea{display:block;width:100%;height:86px;border:0;outline:none;resize:none;padding:4px 14px;font-size:13px;background:#fff}
.ch-comp textarea::placeholder{color:#444}
.ch-bar{display:flex;align-items:center;gap:14px;padding:6px 12px 10px 14px;color:#555}
.ch-bar .b{width:20px;height:20px}
.ch-bar .sp{flex:1}
.ch-bar button{width:88px;height:32px;border:1px solid #9b9b9b;border-radius:3px;background:#fff;color:#222;font-size:13px}
.ch-empty{color:#888;text-align:center;padding:40px 16px;line-height:1.7;font-size:12.5px}
.ch-st{font-size:11px;color:#999;margin-left:6px}

/* ---------- 협업툴형 ---------- */
.c{display:flex;height:100%}
.c-side{width:240px;flex:none;background:#2b2f3a;color:#c9ccd4;display:flex;flex-direction:column}
.c-ws{height:50px;display:flex;align-items:center;gap:6px;padding:0 10px 0 16px;border-bottom:1px solid #3a3f4c;color:#fff}
.c-ws b{flex:1;font-size:15px}
.c-ws .ic{opacity:.6}
.c-ws .ic:hover{background:#3a3f4c}
.c-nav{overflow:auto;flex:1;padding:10px 0}
.c-sec{padding:12px 16px 4px;font-size:12px;color:#8d929e}
.c-ch{display:flex;align-items:center;gap:8px;padding:5px 16px;cursor:pointer}
.c-ch:hover{background:#353a46}
.c-ch.on{background:#4a6fd8;color:#fff}
.c-ch .h{width:16px;text-align:center;opacity:.7}
.c-ch span:nth-child(2){flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-ch.unread span:nth-child(2){color:#fff;font-weight:700}
.c-main{flex:1;display:flex;flex-direction:column;min-width:0;background:#fff}
.c-head{height:50px;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid #e3e5e8}
.c-head b{font-size:15px}
.c-head small{color:#888}
.c-list{flex:1;overflow:auto;padding:8px 0 12px}
.c-day{display:flex;align-items:center;gap:10px;margin:14px 18px 4px;color:#666;font-size:12px;font-weight:600}
.c-day::before,.c-day::after{content:"";flex:1;height:1px;background:#e3e5e8}
.c-msg{display:flex;gap:10px;padding:5px 18px}
.c-msg:hover{background:#f7f8f9}
.c-msg .av{width:34px;height:34px;border-radius:6px;font-size:13px}
.c-msg .bd{min-width:0;flex:1}
.c-msg .hd b{margin-right:6px}
.c-msg .hd time{font-size:11px;color:#999}
.c-msg .txt{line-height:1.55;margin-top:1px}
.c-msg.cont{padding-top:1px}
.c-msg.cont .av{visibility:hidden;height:0}
.c-comp{padding:0 18px 16px}
.c-box{display:flex;align-items:flex-end;gap:6px;border:1px solid #c9ccd2;border-radius:8px;padding:8px 8px 8px 12px}
.c-box:focus-within{border-color:#4a6fd8}
.c-box textarea{flex:1;border:0;outline:none;resize:none;height:44px;line-height:1.5}
.c-box button{width:34px;height:30px;border-radius:6px;background:#4a6fd8;color:#fff;font-size:13px}

/* ---------- 시트형 ---------- */
.s{display:flex;flex-direction:column;height:100%;background:#f3f3f3;font-size:12px}
.s-tabs{display:flex;align-items:center;gap:2px;padding:0 8px;height:32px;background:#1f6e43;color:#fff}
.s-tabs span{padding:6px 10px;opacity:.9}
.s-tabs span.on{background:#f3f3f3;color:#1f6e43;border-radius:3px 3px 0 0;align-self:flex-end;font-weight:600}
.s-tabs .sp{flex:1}
.s-tabs .ic{color:#fff}
.s-tabs .ic:hover{background:rgba(255,255,255,.15)}
.s-tool{display:flex;align-items:center;gap:4px;height:38px;padding:0 10px;border-bottom:1px solid #d4d4d4;color:#444;overflow:hidden;white-space:nowrap}
.s-tool .bx{border:1px solid #c8c8c8;background:#fff;padding:2px 8px;border-radius:2px}
.s-tool .tb{padding:3px 7px;border-radius:2px}
.s-tool .tb:hover{background:#e1e1e1}
.s-tool .sep{width:1px;height:20px;background:#d0d0d0;margin:0 6px}
.s-fx{display:flex;align-items:center;height:28px;background:#fff;border-bottom:1px solid #d4d4d4}
.s-ref{width:70px;height:100%;border-right:1px solid #d4d4d4;display:grid;place-items:center;color:#333}
.s-fxl{width:36px;text-align:center;color:#777;font-style:italic;font-family:Georgia,serif}
.s-fx input{flex:1;height:100%;border:0;outline:none;padding:0 6px;background:#fff}
.s-grid{flex:1;overflow:auto;background:#fff}
.s-grid table{border-collapse:collapse;table-layout:fixed;min-width:760px;width:100%}
.s-grid th,.s-grid td{border:1px solid #e1e1e1;height:22px;padding:2px 5px;vertical-align:top;overflow:hidden}
.s-grid thead th{position:sticky;top:0;background:#efefef;color:#555;font-weight:400;border-color:#d4d4d4;z-index:1}
.s-grid tbody th{background:#efefef;color:#666;font-weight:400;border-color:#d4d4d4;width:40px;text-align:center}
.s-grid tr.hd td{background:#ddebe2;font-weight:600;text-align:center}
.s-grid td.ce{text-align:center}
.s-grid td.ri{text-align:right}
.s-grid td.e{white-space:pre-wrap;word-break:break-word}
.s-grid tr.me td.d{color:#1f6e43}
.s-grid td.sel{outline:2px solid #1f6e43;outline-offset:-2px}
.s-sheets{display:flex;align-items:center;height:28px;background:#f3f3f3;border-top:1px solid #d4d4d4;padding-left:30px}
.s-sheets span.t{padding:0 16px;height:100%;display:grid;place-items:center;cursor:pointer;border-right:1px solid #d4d4d4}
.s-sheets span.t.on{background:#fff;color:#1f6e43;font-weight:600;border-bottom:2px solid #1f6e43}
.s-sheets .sp{flex:1}
.s-sheets .st{padding:0 12px;color:#666}

/* ---------- 설정 ---------- */
.modal{position:fixed;inset:0;background:rgba(20,24,32,.45);display:grid;place-items:center;padding:16px;z-index:10}
.card{width:min(380px,100%);background:#fff;border-radius:10px;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.card h2{font-size:16px;margin-bottom:4px}
.card p.d{color:#777;font-size:12px;line-height:1.6;margin-bottom:14px}
.card label{display:block;font-size:12px;color:#555;margin:10px 0 4px}
.card input[type=text],.card input[type=password],.card select{width:100%;height:36px;border:1px solid #d3d6db;border-radius:6px;padding:0 10px;font-size:14px;background:#fff}
.card .chk{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:12px;color:#444}
.card .btns{display:flex;gap:8px;margin-top:18px}
.card .btns button{flex:1;height:38px;border-radius:6px;background:#eef0f3}
.card .btns button.pri{background:#3b6fd4;color:#fff;font-weight:600}
.card .warn{color:#c0392b;font-size:12px;margin-top:8px;min-height:16px}
.card .tip{color:#888;font-size:11px;margin-top:12px;line-height:1.6}
.card .lnk{color:#c0392b;font-size:12px;text-decoration:underline;margin-top:10px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#333;color:#fff;padding:8px 14px;border-radius:6px;font-size:12px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:.95}
img.pic{display:block;max-width:min(240px,60vw);max-height:280px;min-width:60px;min-height:40px;cursor:zoom-in;background:#ddd}
.pic-gone{color:#888;font-size:12px}
.ch-bub.im{padding:3px;background:#fff}
.s-grid img.pic{max-height:90px;max-width:160px;min-height:0}
.c-box .pb{width:30px;height:30px;border-radius:6px;background:#eceef1;color:#555;font-size:16px}
.s-tabs .picBtn{cursor:pointer}
.picBtn{cursor:pointer}
#viewer{position:fixed;inset:0;background:rgba(0,0,0,.85);display:grid;place-items:center;z-index:30;cursor:zoom-out;padding:12px}
#viewer img{max-width:100%;max-height:100%;object-fit:contain}

@media (max-width:860px){
  .ch-main{width:100%;border-right:0}
  .ch:not(.side) .ch-main{display:none}
  .ch.side .ch-chat{display:none}
  .ch .back{display:inline-block}
}
@media (max-width:860px) and (hover:hover) and (pointer:fine){
  .ch .back{display:none}
}
@media (max-width:700px){
  .c-side{width:100%}
  .c:not(.side) .c-side{display:none}
  .c.side .c-main{display:none}
  .back{display:inline-grid}
  .c-head{padding:0 8px}
  .ch-comp textarea,.c-box textarea,.s-fx input{font-size:16px}
  .ch-bub{max-width:70vw}
  .ch-bar{padding-bottom:max(10px,env(safe-area-inset-bottom))}
  .c-comp{padding:0 10px max(10px,env(safe-area-inset-bottom))}
  .s-tool{display:none}
}
</style>
</head>
<body>
<div id="app"></div>

<div id="setup" class="modal hidden">
  <div class="card">
    <h2>환경 설정</h2>
    <p class="d">같은 방 암호를 넣은 사람끼리 연결됩니다. 대화는 이 암호로 암호화돼서 오가요.</p>
    <label for="fPass">방 암호 (8자 이상 권장)</label>
    <input id="fPass" type="password" autocomplete="off">
    <label for="fMe">내 이름 (상대와 다르게)</label>
    <input id="fMe" type="text" maxlength="20">
    <label for="fPeer">상대 표시 이름 (내 화면에서만 보임)</label>
    <input id="fPeer" type="text" maxlength="20" placeholder="예: 품질팀 김대리">
    <label for="fSkin">화면 스타일</label>
    <select id="fSkin">
      <option value="msg">사내 메신저형</option>
      <option value="collab">업무 협업툴형</option>
      <option value="sheet">엑셀 시트형</option>
    </select>
    <label class="chk"><input id="fAuto" type="checkbox"> 창을 벗어나면 자동으로 업무 화면으로 전환</label>
    <div class="warn" id="fWarn"></div>
    <div class="btns"><button id="fCancel">취소</button><button id="fSave" class="pri">저장</button></div>
    <button class="lnk" id="fClear">이 기기의 대화 기록 지우기</button>
    <p class="tip">오늘 남은 전송: <span id="qtm">-</span>건</p>
    <p class="tip">Esc 키: 업무 화면 ↔ 대화 전환 · Enter 전송, Shift+Enter 줄바꿈<br>서버에는 최근 12시간치만 남고, 기록은 각자 기기에 저장돼요.</p>
  </div>
</div>
<div id="toast"></div>
<input type="file" id="picFile" accept="image/*" hidden>
<div id="viewer" class="hidden"><img alt=""></div>

<script>
'use strict';
const RELAY = 'https://ntfy.sh';
const MAX_BYTES = 2800;   // 암호화 후 ntfy 본문 한도(4096바이트) 안에 들도록

// ?p=xx 로 같은 브라우저에서 프로필을 나눠 쓸 수 있다(테스트용)
const P = new URLSearchParams(location.search).get('p') || '';
const K = k => 'wt' + P + '_' + k;
const load = (k, d) => { try { const v = localStorage.getItem(K(k)); return v ? JSON.parse(v) : d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(K(k), JSON.stringify(v)); } catch {} };

let cfg = load('cfg', null);
let msgs = [], seen = new Set();
let view = 'real', lastDecoy = null, unread = 0, mobileSide = false;
let chTab = 'chat', selNote = 0;   // 메신저형 왼쪽 목록: 대화 / 쪽지
let key = null, topic = null, es = null, status = '', quota = null;

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const hm = ts => { const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const ymd = ts => { const d = new Date(ts); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const dayLabel = ts => { const d = new Date(ts); return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 ${'일월화수목금토'[d.getDay()]}요일`; };
const COLORS = ['#5b7fd6', '#d6875b', '#4ea786', '#9b6bd1', '#d65b7f', '#5ba8d6'];
const colorOf = s => COLORS[[...s].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length];
const initial = s => (s.replace(/^.*\s/, '') || s).slice(0, 1);
const mine = m => m.n === cfg.me;

function toast(t) {
  const el = $('#toast'); el.textContent = t; el.classList.add('show');
  clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('show'), 2500);
}

// ---------- 암호화 ----------
const te = new TextEncoder(), td = new TextDecoder();
const b64 = u8 => btoa(String.fromCharCode(...u8));
const ub64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function derive(pass) {
  const base = await crypto.subtle.importKey('raw', te.encode(pass), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits(
    {name: 'PBKDF2', salt: te.encode('worktalk-v1'), iterations: 200000, hash: 'SHA-256'}, base, 512));
  key = await crypto.subtle.importKey('raw', bits.slice(0, 32), 'AES-GCM', false, ['encrypt', 'decrypt']);
  topic = 'wt' + [...bits.slice(32, 48)].map(b => b.toString(16).padStart(2, '0')).join('');
}
async function seal(obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name: 'AES-GCM', iv}, key, te.encode(JSON.stringify(obj))));
  return b64(iv) + '.' + b64(ct);
}
async function unseal(s) {
  try {
    const [a, b] = s.split('.');
    const pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: ub64(a)}, key, ub64(b));
    return JSON.parse(td.decode(pt));
  } catch { return null; }
}

function connect() {
  if (es) es.close();
  msgs = load('msgs_' + topic.slice(2, 10), []);
  seen = new Set(msgs.map(m => m.id));
  setStatus('');
  es = new EventSource(`${RELAY}/${topic}/sse?since=12h`);
  es.onopen = () => setStatus('on');
  es.onerror = () => setStatus('off');
  es.onmessage = async e => {
    let d; try { d = JSON.parse(e.data); } catch { return; }
    if (d.event !== 'message' || seen.has(d.id)) return;
    const o = await unseal(d.message || '');
    if (!o || typeof o.t !== 'string') return;
    const m = {id: d.id, n: String(o.n || ''), t: o.t, ts: Number(o.ts) || d.time * 1000};
    if (o.img && d.attachment) Object.assign(m, {t: '사진', img: 1, u: d.attachment.url, x: d.attachment.expires * 1000, mime: o.mime});
    add(m);
    if (m.img) fetchPic(m);
  };
  refreshQuota();
  render();
}

function add(m) {
  if (seen.has(m.id)) return;
  seen.add(m.id);
  msgs.push(m);
  msgs.sort((a, b) => a.ts - b.ts);
  if (msgs.length > 3000) msgs = msgs.slice(-3000);
  save('msgs_' + topic.slice(2, 10), msgs);
  if (!mine(m) && (view !== 'real' || mobileSide || document.hidden)) unread++;
  renderList(); paintSide(); paintTitle();
}

  try {

    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    add({id: d.id, n: payload.n, t: payload.t, ts: payload.ts});
    refreshQuota();
    return true;

}

// ---------- 사진 ----------
// 사진은 이 방 키로 암호화한 바이트를 ntfy 첨부로 올린다(서버 보관 3시간). 받은 사진은 기기의 IndexedDB에 보관.
const PIC_MAX = 1.9 * 1024 * 1024;   // ntfy 익명 첨부 한도 2MB
const picUrls = new Map(), picBusy = new Set();
let dbp = null;
function picDb() {
  return dbp ||= new Promise((res, rej) => {
    const r = indexedDB.open('wt' + P + '_pics', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('p');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function picGet(id) {
  try {
    const db = await picDb();
    return await new Promise(res => { const q = db.transaction('p').objectStore('p').get(id); q.onsuccess = () => res(q.result); q.onerror = () => res(null); });
  } catch { return null; }
}
async function picPut(id, blob) {
  try {
    const db = await picDb();
    await new Promise(res => { const t = db.transaction('p', 'readwrite'); t.objectStore('p').put(blob, id); t.oncomplete = t.onerror = () => res(); });
  } catch {}
}
const picTag = id => `<img class="pic" data-pic="${esc(id)}" alt="사진">`;

async function fetchPic(m) {
  if (picBusy.has(m.id) || !m.u) return;
  picBusy.add(m.id);
  try {
    const buf = new Uint8Array(await (await fetch(m.u)).arrayBuffer());
    const pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: buf.slice(0, 12)}, key, buf.slice(12));
    const blob = new Blob([pt], {type: m.mime || 'image/jpeg'});
    await picPut(m.id, blob);
    picUrls.set(m.id, URL.createObjectURL(blob));
  } catch {}
  picBusy.delete(m.id);
  fillPics();
}
async function fillPics() {
  for (const el of document.querySelectorAll('img.pic[data-pic]:not([src])')) {
    const id = el.dataset.pic;
    if (!picUrls.has(id)) {
      const blob = await picGet(id);
      if (blob) picUrls.set(id, URL.createObjectURL(blob));
    }
    if (picUrls.has(id)) { el.src = picUrls.get(id); continue; }
    const m = msgs.find(x => x.id === id);
    if (m && m.u && Date.now() < m.x) { el.alt = '사진 받는 중…'; fetchPic(m); }
    else el.replaceWith(Object.assign(document.createElement('span'), {className: 'pic-gone', textContent: '사진 (보관 기간이 지났어요)'}));
  }
}

async function shrink(file) {
  if (file.type === 'image/gif' && file.size <= PIC_MAX) return file;
  const bmp = await createImageBitmap(file);
  const s = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const cv = Object.assign(document.createElement('canvas'), {width: Math.round(bmp.width * s), height: Math.round(bmp.height * s)});
  cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
  for (const q of [0.82, 0.7, 0.55, 0.4]) {
    const b = await new Promise(r => cv.toBlob(r, 'image/jpeg', q));
    if (b && b.size <= PIC_MAX) return b;
  }
  throw new Error('too big');
}

async function sendPic(file) {
  if (view !== 'real' || !key || !file || !file.type.startsWith('image/')) return;
  toast('사진 보내는 중…');
  try {
    const blob = await shrink(file);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({name: 'AES-GCM', iv}, key, await blob.arrayBuffer()));
    const body = new Uint8Array(12 + ct.length); body.set(iv); body.set(ct, 12);
    const payload = {n: cfg.me, t: '', img: 1, mime: blob.type, ts: Date.now()};
    const r = await fetch(`${RELAY}/${topic}`, {method: 'PUT', body, headers: {'Filename': 'p.bin', 'X-Message': await seal(payload)}});
    if (r.status === 429) { toast('오늘 보낼 수 있는 양을 다 썼어요'); return; }
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    await picPut(d.id, blob);
    picUrls.set(d.id, URL.createObjectURL(blob));
    add({id: d.id, n: cfg.me, t: '사진', img: 1, u: d.attachment?.url, x: (d.attachment?.expires || 0) * 1000, mime: blob.type, ts: payload.ts});
    refreshQuota();
    toast('사진을 보냈어요');
  } catch (e) { toast(e.message === 'too big' ? '사진이 너무 커요' : '사진 전송 실패 — 네트워크를 확인하세요'); }
}

            <div class="ch-bar"><span class="b">${IC.emo}</span><span class="b">${IC.smile}</span><span class="b">${IC.tt}</span><span class="b picBtn" title="사진">${IC.clip}</span>
              <span class="b picBtn" title="사진">${IC.folder}</span><span class="b">${IC.crop}</span><span class="b">${IC.down}</span><i class="sp"></i><button id="sendBtn">전송</button></div>
          </div>
        </section></div>`;
    },

      document.querySelectorAll('[data-tab]').forEach(el => el.addEventListener('click', () => { chTab = el.dataset.tab; mobileSide = true; render(); }));

    },

      const lr = lastReal();

      ul.querySelectorAll('li').forEach(li => li.addEventListener('click', () => setView(li.dataset.r)));
    },
    list() {
      const peer = nameOnly(cfg.peer);
      let src;
      if (view !== 'real') {
        src = CHC[view].lines.map(([n, t, x]) => ({me: n === '나', n, t, x, day: '오늘'}));
      } else {
        if (!msgs.length) return `<div class="ch-empty">아직 대화가 없어요.<br>상대도 같은 방 암호로 접속하면 연결됩니다.</div>`;
        src = msgs.map(m => ({me: mine(m), n: peer, t: chatTime(m.ts), x: m.t, day: chatDay(m.ts), pic: m.img ? m.id : null}));
      }
      const bub = r => r.pic ? `<div class="ch-bub im">${picTag(r.pic)}</div>` : `<div class="ch-bub txt">${esc(r.x)}</div>`;
      let out = '', day = '', i = 0;
      while (i < src.length) {
        const m = src[i];
        if (m.day !== day) { day = m.day; out += `<div class="ch-day"><span>${esc(day)}</span></div>`; }
        let j = i;
        while (j < src.length && src[j].me === m.me && src[j].n === m.n && src[j].day === day) j++;
        const run = src.slice(i, j);
        if (m.me) out += run.map((r, k) => `<div class="ch-m${k ? '' : ' first'}"><time>${r.t}</time>${bub(r)}</div>`).join('');
        else out += `<div class="ch-o"><div class="av">${esc(initial(m.n))}</div><div><div class="nm">${esc(m.n)}</div>
          ${run.map(r => `<div class="row">${bub(r)}<time>${r.t}</time></div>`).join('')}</div></div>`;
        i = j;
      }
      return out;
    }
  },

  collab: {
    layout() {
      const title = view === 'real' ? cfg.peer : '# ' + fakeOf(view).name;
      return `<div class="c${mobileSide ? ' side' : ''}">
        <aside class="c-side">
          <div class="c-ws"><b>업무공간</b><span class="dot"></span><button class="ic gear" title="설정">⚙</button></div>
          <nav class="c-nav" id="nav"></nav>
        </aside>
        <section class="c-main">
          <header class="c-head"><button class="ic back">‹</button><b>${esc(title)}</b><small>${view === 'real' ? '<span id="qt"></span>' : ''}</small></header>

    },
    list() {
      const item = (n, t, x, cont) => `<div class="c-msg${cont ? ' cont' : ''}"><div class="av" style="background:${colorOf(n)}">${esc(initial(n))}</div>
        <div class="bd">${cont ? '' : `<div class="hd"><b>${esc(n)}</b><time>${t}</time></div>`}<div class="txt">${x}</div></div></div>`;
      if (view !== 'real') return fakeOf(view).lines.map(([n, t, x]) => item(n === '나' ? cfg.me : n, t, esc(x))).join('');
      if (!msgs.length) return `<div class="empty">아직 대화가 없어요.<br>상대도 같은 방 암호로 접속하면 연결됩니다.</div>`;
      let out = '', day = '', prev = null;
      for (const m of msgs) {
        if (ymd(m.ts) !== day) { day = ymd(m.ts); out += `<div class="c-day">${dayLabel(m.ts)}</div>`; prev = null; }
        const cont = prev && prev.n === m.n && m.ts - prev.ts < 5 * 60e3;
        out += item(mine(m) ? cfg.me : cfg.peer, hm(m.ts), m.img ? picTag(m.id) : esc(m.t), cont);
        prev = m;
      }
      return out;

  },

  sheet: {
    layout() {
      const tabs = ['파일', '홈', '삽입', '페이지 레이아웃', '수식', '데이터', '검토', '보기'];
      return `<div class="s">
        <div class="s-tabs">${tabs.map(t => `<span class="${t === '홈' ? 'on' : t === '삽입' ? 'picBtn' : ''}">${t}</span>`).join('')}<i class="sp"></i><button class="ic gear" title="설정">⚙</button></div>
        <div class="s-tool"><span class="tb">붙여넣기</span><span class="sep"></span><span class="bx">맑은 고딕</span><span class="bx">11</span>
          <span class="tb"><b>가</b></span><span class="tb"><i>가</i></span><span class="tb"><u>가</u></span><span class="sep"></span>
          <span class="tb">≡</span><span class="tb">병합하고 가운데 맞춤</span><span class="sep"></span><span class="bx">일반</span><span class="tb">%</span><span class="tb">,</span>
          <span class="sep"></span><span class="tb">조건부 서식</span><span class="tb">표 서식</span><span class="tb">셀 스타일</span></div>
        <div class="s-fx"><span class="s-ref" id="ref">E2</span><span class="s-fxl">fx</span><input id="inp" autocomplete="off" ${view === 'real' ? '' : 'readonly'}></div>
        <div class="s-grid" id="list"></div>
        <div class="s-sheets"><span class="t${view === 'real' ? ' on' : ''}" data-v="real">업무일지</span><span class="t${view === 'team' ? ' on' : ''}" data-v="team">집계</span><span class="t">Sheet3</span>
          <i class="sp"></i><span class="st">준비 <span class="dot"></span> <span id="qt"></span></span></div></div>`;
    },
    list() {
      const cols = ['', 'A', 'B', 'C', 'D', 'E', 'F'];
      const widths = [40, 48, 92, 60, 110, null, 120];
      let head = `<colgroup>${widths.map(w => `<col${w ? ` style="width:${w}px"` : ''}>`).join('')}</colgroup>
        <thead><tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>`;
      let rows = [], r = 1;
      if (view === 'real') {
        rows.push(`<tr class="hd"><th>${r++}</th><td>No</td><td>일자</td><td>시간</td><td>담당</td><td>내용</td><td>비고</td></tr>`);
        msgs.forEach((m, i) => rows.push(`<tr class="${mine(m) ? 'me' : ''}"><th>${r++}</th><td class="ce">${i + 1}</td><td class="ce">${ymd(m.ts)}</td><td class="ce">${hm(m.ts)}</td>
          <td class="d">${esc(mine(m) ? cfg.me : cfg.peer)}</td><td class="e">${m.img ? picTag(m.id) : esc(m.t)}</td><td></td></tr>`));
        const sel = r;
        rows.push(`<tr><th>${r++}</th><td class="ce">${msgs.length + 1}</td><td></td><td></td><td></td><td class="sel"></td><td></td></tr>`);
        this.selRow = sel;
      } else {
        const months = ['7월', '8월', '9월', '10월'];
        const data = [['이물', 14, 11, 16, 12], ['변질', 6, 9, 5, 7], ['포장불량', 8, 7, 10, 6], ['표시사항', 2, 1, 3, 2], ['기타', 4, 5, 3, 4]];
        rows.push(`<tr class="hd"><th>${r++}</th><td>No</td><td>구분</td>${months.slice(0, 3).map(m => `<td>${m}</td>`).join('')}<td>${months[3]}</td></tr>`);
        data.forEach((d, i) => rows.push(`<tr><th>${r++}</th><td class="ce">${i + 1}</td><td>${d[0]}</td>${d.slice(1).map(v => `<td class="ri">${v}</td>`).join('')}</tr>`));
        const sum = j => data.reduce((a, d) => a + d[j], 0);
        rows.push(`<tr><th>${r++}</th><td></td><td><b>합계</b></td>${[1, 2, 3, 4].map(j => `<td class="ri"><b>${sum(j)}</b></td>`).join('')}</tr>`);
        this.selRow = null;
      }
      while (r <= 40) rows.push(`<tr><th>${r++}</th>${'<td></td>'.repeat(6)}</tr>`);
      return `<table>${head}${rows.join('')}</tbody></table>`;
    },
    after(list) {
      const ref = $('#ref'); if (ref) ref.textContent = this.selRow ? 'E' + this.selRow : 'A1';
      const sel = list.querySelector('td.sel');
      if (sel) list.scrollTop = Math.max(0, sel.offsetTop - list.clientHeight + 60);
    },
    side() { paintStatus(); }
  }
};

// ---------- 설정 ----------
function openSetup() {
  $('#fPass').value = cfg?.pass || '';
  $('#fMe').value = cfg?.me || '';
  $('#fPeer').value = cfg?.peer || '';
  $('#fSkin').value = cfg?.skin || 'msg';
  $('#fAuto').checked = !!cfg?.autoHide;
  $('#fCancel').classList.toggle('hidden', !cfg);
  $('#fClear').classList.toggle('hidden', !cfg);
  $('#fWarn').textContent = '';
  $('#setup').classList.remove('hidden');
  ($('#fPass').value ? $('#fMe') : $('#fPass')).focus();
}
$('#fCancel').addEventListener('click', () => $('#setup').classList.add('hidden'));
$('#fClear').addEventListener('click', () => {
  if (!confirm('이 기기에 저장된 대화 기록을 지울까요? (상대 기기에는 남아요)')) return;
  msgs = []; seen = new Set(); save('msgs_' + topic.slice(2, 10), []);
  $('#setup').classList.add('hidden'); render();
});
$('#fSave').addEventListener('click', async () => {
  const pass = $('#fPass').value, me = $('#fMe').value.trim(), peer = $('#fPeer').value.trim() || '상대';
  if (pass.length < 4) { $('#fWarn').textContent = '방 암호를 4자 이상 넣어주세요.'; return; }
  if (!me) { $('#fWarn').textContent = '내 이름을 넣어주세요.'; return; }
  const passChanged = !cfg || cfg.pass !== pass;
  cfg = {pass, me, peer, skin: $('#fSkin').value, autoHide: $('#fAuto').checked};
  save('cfg', cfg);
  $('#setup').classList.add('hidden');
  if (passChanged) { $('#fWarn').textContent = ''; await derive(pass); connect(); }
  else render();
});

// ---------- 키·창 이벤트 ----------
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && cfg && $('#setup').classList.contains('hidden')) {
    e.preventDefault();
    if (!$('#viewer').classList.contains('hidden')) { $('#viewer').classList.add('hidden'); decoy(); return; }
    toggleDecoy();
  }
});
$('#picFile').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) sendPic(f); });
$('#viewer').addEventListener('click', () => $('#viewer').classList.add('hidden'));
document.addEventListener('click', e => {
  const im = e.target.closest?.('img.pic[src]');
  if (im) { $('#viewer img').src = im.src; $('#viewer').classList.remove('hidden'); }
});
document.addEventListener('dragover', e => { if (cfg && view === 'real') e.preventDefault(); });
document.addEventListener('drop', e => {
  if (!cfg || view !== 'real') return;
  e.preventDefault();
  const f = [...(e.dataTransfer?.files || [])].find(f => f.type.startsWith('image/'));
  if (f) sendPic(f);
});
window.addEventListener('blur', () => { if (cfg?.autoHide && view === 'real') decoy(); });
document.addEventListener('visibilitychange', () => {
  if (cfg && !document.hidden && view === 'real' && !mobileSide) { unread = 0; paintSide(); paintTitle(); }
});

(async () => {
  if (!window.isSecureContext || !crypto.subtle) { document.body.innerHTML = '<p class="empty">이 브라우저에서는 실행할 수 없어요 (보안 연결 필요).</p>'; return; }
  if (!cfg) { openSetup(); return; }
  await derive(cfg.pass);
  connect();
})();
</script>
