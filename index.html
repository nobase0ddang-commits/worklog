<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#bd1d63">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="메신저">
<title>CH Messenger</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Malgun Gothic","맑은 고딕",system-ui,-apple-system,sans-serif;font-size:13px;color:#222;background:#fff;overflow:hidden}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea,select{font:inherit;color:inherit}
#app{height:100%}
.hidden{display:none!important}
.ic{width:28px;height:28px;border-radius:6px;display:inline-grid;place-items:center;font-size:15px;opacity:.75}
.ic:hover{background:rgba(0,0,0,.07);opacity:1}
.back{display:none}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#aaa;vertical-align:middle}
.dot.on{background:#2fb35a}.dot.off{background:#d9534f}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#e5483f;color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center}
.txt{white-space:pre-wrap;word-break:break-word}
.empty{color:#999;text-align:center;padding:40px 16px;line-height:1.7}

/* ---------- 메신저형 (CH) ---------- */
.ch{--pk:#bd1d63;--sel:#dde3f7;--line:#e4e4e8;--av:#86c6d8;display:flex;height:100%;background:#fff;color:#222}
.ch svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ch .av{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--av);color:#fff;font-size:15px;font-weight:600}
.ch .av.grp{background:none;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;place-items:stretch;gap:2px;padding:1px}
.ch .av.grp i{border-radius:50%;background:var(--av);display:grid;place-items:center;font-style:normal;font-size:9px;color:#fff}
.ch-main{width:430px;flex:none;display:flex;flex-direction:column;border-right:1px solid #d9d9de;min-width:0}
.ch-tool{height:58px;flex:none;display:flex;align-items:center;gap:18px;padding:0 14px 0 16px;border-bottom:1px solid #e1e1e6;color:var(--pk)}
.ch-tool .t{width:32px;height:32px;position:relative;cursor:pointer}
.ch-tool .t .badge{position:absolute;top:-6px;right:-10px;transform:scale(.85)}
.ch-tool .sp{flex:1}
.ch-tool .bell{width:34px;height:34px;border-radius:50%;background:#ececf0;color:#9a9aa3;padding:7px}
.ch-body{flex:1;display:flex;min-height:0}
.ch-rail{width:50px;flex:none;border-right:1px solid #e1e1e6;display:flex;flex-direction:column;align-items:center;gap:22px;padding-top:16px;color:var(--pk)}
.ch-rail .r{width:26px;height:26px;cursor:pointer}
.ch-pane{flex:1;display:flex;flex-direction:column;min-width:0;background:#fff}
.ch-search{height:40px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px 0 12px;border-bottom:1px solid #e1e1e6;color:#999}
.ch-search .mg{width:16px;height:16px;flex:none}
.ch-search span.ph{flex:1;font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ch-search .s{width:18px;height:18px;color:#777;flex:none}
.ch-tabs{height:40px;flex:none;display:flex;align-items:flex-end;gap:2px;padding:0 10px}
.ch-tabs span{padding:0 7px 9px;font-size:13px;color:#333;border-bottom:2px solid transparent;cursor:pointer}
.ch-tabs span.on{color:#4b4f9c;border-color:#5e63b6;font-weight:600}
.ch-tabs .chev{width:16px;height:16px;margin:0 0 9px 8px;color:#555}
.ch-list{flex:1;overflow:auto;list-style:none}
.ch-list li{display:flex;gap:12px;padding:9px 14px 8px 18px;cursor:pointer;position:relative}
.ch-list li::after{content:"";position:absolute;left:18px;right:16px;bottom:0;height:1px;background:var(--line)}
.ch-list li:hover{background:#f3f4fa}
.ch-list li.on{background:var(--sel)}
.ch-list .av{margin-top:2px}
.ch-list .meta{flex:1;min-width:0;line-height:1.55}
.ch-list .l1{display:flex;align-items:baseline;gap:10px}
.ch-list .l1 b{font-size:13.5px;font-weight:700;white-space:nowrap}
.ch-list .l1 small{color:#888;font-size:11.5px;font-weight:600;white-space:nowrap}
.ch-list .l1 .badge{margin-left:auto}
.ch-list .l2,.ch-list .l3{font-size:12.5px;color:#222;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ch-list .l2 .cl,.ch-list .l2 .ps{display:inline-block;width:15px;height:15px;vertical-align:-3px;margin-right:4px;color:#555}
.ch-list .l2 .ps{color:#4b6fd0}
.ch-chat{flex:1;display:flex;flex-direction:column;min-width:0;background:#f3f3f3}
.ch-head{flex:none;background:#f6f6f6;border-bottom:1px solid #dcdcdc;padding:8px 12px 6px 14px}
.ch-head .r1{display:flex;align-items:center;gap:12px}
.ch-head .r1 .av{width:44px;height:44px;font-size:17px}
.ch-head .hi{width:20px;height:20px;color:#555}
.ch-head .r2{display:flex;align-items:center;gap:6px;margin:2px 0 0 4px;font-size:13px}
.ch-head .r2 .av{width:18px;height:18px;font-size:9px}
.ch-head .r2 .sp{flex:1}
.ch-head .r2 .cb{width:24px;height:24px;border-radius:50%;background:#e2e2e6;color:#666;padding:5px}
.ch-head .back{width:22px;height:22px;color:#555;cursor:pointer}
.ch-msgs{flex:1;overflow:auto;padding:6px 12px 10px}
.ch-day{display:flex;align-items:center;margin:12px -4px;font-size:12px;color:#333}
.ch-day::before,.ch-day::after{content:"";flex:1;height:1px;background:#c9c9c9}
.ch-day span{background:#d9d9d9;border:1px solid #c4c4c4;padding:1px 6px}
.ch-o{display:flex;gap:9px;margin-top:10px}
.ch-o .av{width:36px;height:36px;font-size:14px}
.ch-o .nm{font-size:13px;color:#333;margin:1px 0 5px}
.ch-o .row{display:flex;align-items:flex-end;gap:6px;margin-bottom:6px}
.ch-bub{max-width:min(420px,64vw);padding:7px 11px;font-size:13px;line-height:1.5;border:1px solid #cfcfcf;background:#ececec;border-radius:2px;position:relative}
.ch-o .nm + .row .ch-bub::before{content:"";position:absolute;left:-6px;top:6px;border:5px solid transparent;border-right-color:#cfcfcf;border-left:0}
.ch-m{display:flex;justify-content:flex-end;align-items:flex-end;gap:6px;margin:6px 0}
.ch-m .ch-bub{background:#f6d61c;border-color:#d9b70b}
.ch-m.first .ch-bub::after{content:"";position:absolute;right:-6px;top:6px;border:5px solid transparent;border-left-color:#d9b70b;border-right:0}
.ch-o time,.ch-m time{font-size:11px;color:#555;white-space:nowrap}
.ch-comp{flex:none;background:#fff;border-top:1px solid #d6d6d6}
.ch-grip{height:6px;display:grid;place-items:center}
.ch-grip::before{content:"";width:14px;height:3px;border-top:1px solid #aaa;border-bottom:1px solid #aaa}
.ch-comp textarea{display:block;width:100%;height:86px;border:0;outline:none;resize:none;padding:4px 14px;font-size:13px;background:#fff}
.ch-comp textarea::placeholder{color:#444}
.ch-bar{display:flex;align-items:center;gap:14px;padding:6px 12px 10px 14px;color:#555}
.ch-bar .b{width:20px;height:20px}
.ch-bar .sp{flex:1}
.ch-bar button{width:88px;height:32px;border:1px solid #9b9b9b;border-radius:3px;background:#fff;color:#222;font-size:13px}
.ch-empty{color:#888;text-align:center;padding:40px 16px;line-height:1.7;font-size:12.5px}
.ch-st{font-size:11px;color:#999;margin-left:6px}

/* ---------- 협업툴형 ---------- */
.c{display:flex;height:100%}
.c-side{width:240px;flex:none;background:#2b2f3a;color:#c9ccd4;display:flex;flex-direction:column}
.c-ws{height:50px;display:flex;align-items:center;gap:6px;padding:0 10px 0 16px;border-bottom:1px solid #3a3f4c;color:#fff}
.c-ws b{flex:1;font-size:15px}
.c-ws .ic{opacity:.6}
.c-ws .ic:hover{background:#3a3f4c}
.c-nav{overflow:auto;flex:1;padding:10px 0}
.c-sec{padding:12px 16px 4px;font-size:12px;color:#8d929e}
.c-ch{display:flex;align-items:center;gap:8px;padding:5px 16px;cursor:pointer}
.c-ch:hover{background:#353a46}
.c-ch.on{background:#4a6fd8;color:#fff}
.c-ch .h{width:16px;text-align:center;opacity:.7}
.c-ch span:nth-child(2){flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-ch.unread span:nth-child(2){color:#fff;font-weight:700}
.c-main{flex:1;display:flex;flex-direction:column;min-width:0;background:#fff}
.c-head{height:50px;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid #e3e5e8}
.c-head b{font-size:15px}
.c-head small{color:#888}
.c-list{flex:1;overflow:auto;padding:8px 0 12px}
.c-day{display:flex;align-items:center;gap:10px;margin:14px 18px 4px;color:#666;font-size:12px;font-weight:600}
.c-day::before,.c-day::after{content:"";flex:1;height:1px;background:#e3e5e8}
.c-msg{display:flex;gap:10px;padding:5px 18px}
.c-msg:hover{background:#f7f8f9}
.c-msg .av{width:34px;height:34px;border-radius:6px;font-size:13px}
.c-msg .bd{min-width:0;flex:1}
.c-msg .hd b{margin-right:6px}
.c-msg .hd time{font-size:11px;color:#999}
.c-msg .txt{line-height:1.55;margin-top:1px}
.c-msg.cont{padding-top:1px}
.c-msg.cont .av{visibility:hidden;height:0}
.c-comp{padding:0 18px 16px}
.c-box{display:flex;align-items:flex-end;gap:6px;border:1px solid #c9ccd2;border-radius:8px;padding:8px 8px 8px 12px}
.c-box:focus-within{border-color:#4a6fd8}
.c-box textarea{flex:1;border:0;outline:none;resize:none;height:44px;line-height:1.5}
.c-box button{width:34px;height:30px;border-radius:6px;background:#4a6fd8;color:#fff;font-size:13px}

/* ---------- 시트형 ---------- */
.s{display:flex;flex-direction:column;height:100%;background:#f3f3f3;font-size:12px}
.s-tabs{display:flex;align-items:center;gap:2px;padding:0 8px;height:32px;background:#1f6e43;color:#fff}
.s-tabs span{padding:6px 10px;opacity:.9}
.s-tabs span.on{background:#f3f3f3;color:#1f6e43;border-radius:3px 3px 0 0;align-self:flex-end;font-weight:600}
.s-tabs .sp{flex:1}
.s-tabs .ic{color:#fff}
.s-tabs .ic:hover{background:rgba(255,255,255,.15)}
.s-tool{display:flex;align-items:center;gap:4px;height:38px;padding:0 10px;border-bottom:1px solid #d4d4d4;color:#444;overflow:hidden;white-space:nowrap}
.s-tool .bx{border:1px solid #c8c8c8;background:#fff;padding:2px 8px;border-radius:2px}
.s-tool .tb{padding:3px 7px;border-radius:2px}
.s-tool .tb:hover{background:#e1e1e1}
.s-tool .sep{width:1px;height:20px;background:#d0d0d0;margin:0 6px}
.s-fx{display:flex;align-items:center;height:28px;background:#fff;border-bottom:1px solid #d4d4d4}
.s-ref{width:70px;height:100%;border-right:1px solid #d4d4d4;display:grid;place-items:center;color:#333}
.s-fxl{width:36px;text-align:center;color:#777;font-style:italic;font-family:Georgia,serif}
.s-fx input{flex:1;height:100%;border:0;outline:none;padding:0 6px;background:#fff}
.s-grid{flex:1;overflow:auto;background:#fff}
.s-grid table{border-collapse:collapse;table-layout:fixed;min-width:760px;width:100%}
.s-grid th,.s-grid td{border:1px solid #e1e1e1;height:22px;padding:2px 5px;vertical-align:top;overflow:hidden}
.s-grid thead th{position:sticky;top:0;background:#efefef;color:#555;font-weight:400;border-color:#d4d4d4;z-index:1}
.s-grid tbody th{background:#efefef;color:#666;font-weight:400;border-color:#d4d4d4;width:40px;text-align:center}
.s-grid tr.hd td{background:#ddebe2;font-weight:600;text-align:center}
.s-grid td.ce{text-align:center}
.s-grid td.ri{text-align:right}
.s-grid td.e{white-space:pre-wrap;word-break:break-word}
.s-grid tr.me td.d{color:#1f6e43}
.s-grid td.sel{outline:2px solid #1f6e43;outline-offset:-2px}
.s-sheets{display:flex;align-items:center;height:28px;background:#f3f3f3;border-top:1px solid #d4d4d4;padding-left:30px}
.s-sheets span.t{padding:0 16px;height:100%;display:grid;place-items:center;cursor:pointer;border-right:1px solid #d4d4d4}
.s-sheets span.t.on{background:#fff;color:#1f6e43;font-weight:600;border-bottom:2px solid #1f6e43}
.s-sheets .sp{flex:1}
.s-sheets .st{padding:0 12px;color:#666}

/* ---------- 설정 ---------- */
.modal{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(20,24,32,.45);display:grid;place-items:center;padding:16px;z-index:10}
.card{width:min(380px,100%);background:#fff;border-radius:10px;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.card h2{font-size:16px;margin-bottom:4px}
.card p.d{color:#777;font-size:12px;line-height:1.6;margin-bottom:14px}
.card label{display:block;font-size:12px;color:#555;margin:10px 0 4px}
.card input[type=text],.card input[type=password],.card select{width:100%;height:36px;border:1px solid #d3d6db;border-radius:6px;padding:0 10px;font-size:14px;background:#fff}
.card .chk{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:12px;color:#444}
.card .btns{display:flex;gap:8px;margin-top:18px}
.card .btns button{flex:1;height:38px;border-radius:6px;background:#eef0f3}
.card .btns button.pri{background:#3b6fd4;color:#fff;font-weight:600}
.card .warn{color:#c0392b;font-size:12px;margin-top:8px;min-height:16px}
.card .tip{color:#888;font-size:11px;margin-top:12px;line-height:1.6}
.card .lnk{color:#c0392b;font-size:12px;text-decoration:underline;margin-top:10px}
.card{width:min(440px,100%);max-height:calc(100vh - 32px);overflow:auto}
.rm{border:1px solid #e3e5e9;border-radius:8px;padding:8px;margin-bottom:8px;background:#fafbfc}
.rm1{display:flex;gap:6px;margin-bottom:6px}
.card .rm select{width:76px;flex:none}
.card .rm .rn{flex:1;min-width:0}
.rm .rx{width:36px;flex:none;border-radius:6px;background:#eef0f3;color:#888}
.card .add{width:100%;height:34px;border:1px dashed #b9bec7;border-radius:6px;color:#3b6fd4;font-size:13px}
.ntf{display:flex;align-items:center;gap:8px;font-size:12px;color:#555;line-height:1.5}
.ntf span{flex:1}
.ntf button{flex:none;height:32px;padding:0 12px;border-radius:6px;background:#bd1d63;color:#fff;font-weight:600}
.s-tw{display:flex;height:100%}
.s-sheets span.t.un{font-weight:700;color:#c0392b}
#err{position:fixed;left:0;right:0;top:0;z-index:99;background:#c0392b;color:#fff;font-size:12px;padding:6px 10px;word-break:break-all}
/* ---------- 채팅 기능(공통) ---------- */
.bw{display:flex;flex-direction:column;align-items:flex-start;max-width:100%;min-width:0}
.ch-m .bw{align-items:flex-end}
.mt{display:flex;flex-direction:column;align-items:flex-end;gap:1px;flex:none}
.row .mt{align-items:flex-start}
.rc{color:#e0a800;font-size:11px;font-weight:700}
.ch-bub.big{background:none!important;border:0!important;padding:0}
.ch-bub.big::before,.ch-bub.big::after{display:none}
.bigemo{font-size:52px;line-height:1.15}
.bigwrap .bigemo{font-size:44px}
.s-grid .bigemo{font-size:22px}
.ch-bub.del,.gone{color:#999;font-style:italic}
.ch-m .ch-bub.del{background:#f4f4f4!important;border-color:#ddd!important}
.quote{border-left:3px solid #bbb;padding:2px 8px;margin:0 0 5px;font-size:12px;color:#555;cursor:pointer;max-width:260px}
.quote b{display:block;font-size:11.5px}
.quote span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-m .quote{border-color:#b89b00}
.reacts{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.rchip{font-size:12px;background:#fff;border:1px solid #d4d4d8;border-radius:11px;padding:0 7px;line-height:20px;cursor:pointer;user-select:none}
.rchip.on{border-color:#bd1d63;background:#fdeef4}
.fcard{display:flex;align-items:center;gap:8px;cursor:pointer;min-width:160px}
.fcard i{font-style:normal;font-size:24px}
.fcard b{display:block;font-weight:600;word-break:break-all}
.fcard small{color:#777;font-size:11px}
.txt a{color:#2a5bd7;text-decoration:underline;word-break:break-all}
.ch-unread{display:flex;align-items:center;margin:14px 0;font-size:11.5px;color:#bd1d63}
.ch-unread::before,.ch-unread::after{content:"";flex:1;height:1px;background:#e3a4bf}
.ch-unread span{padding:0 8px}
.c-unread{color:#d6455d}
.flash{animation:fl 1.5s}
@keyframes fl{0%,60%{background:rgba(255,214,0,.45)}100%{background:transparent}}
mark{background:#ffe066;color:inherit;padding:0}
mark.cur{background:#ff9f1c}
.replyBar{display:flex;align-items:center;gap:8px;padding:6px 12px;background:#f1f2f6;border-top:1px solid #dcdde3;font-size:12px;color:#444;flex:none}
.replyBar span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.replyBar button,.pinBar button{width:24px;height:24px;border-radius:50%;color:#777;flex:none}
.pinBar{display:flex;align-items:center;gap:8px;padding:7px 12px;background:#fff8e1;border-bottom:1px solid #f0e2b0;font-size:12.5px;flex:none}
.pinBar .pt{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer}
.srchBar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:#fff;border-bottom:1px solid #dcdcdc;flex:none}
.srchBar input{flex:1;height:28px;border:1px solid #ccc;border-radius:4px;padding:0 8px;font-size:13px;min-width:0}
.srchBar .cnt{font-size:11.5px;color:#777;min-width:34px;text-align:center}
.srchBar button{width:26px;height:26px;border-radius:4px;background:#f0f0f3;font-size:11px;flex:none}
#emoPanel{position:fixed;z-index:40;background:#fff;border:1px solid #d6d6dc;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.18);overflow:hidden}
#emoPanel .et{display:flex;overflow-x:auto;border-bottom:1px solid #eee;background:#fafafa}
#emoPanel .et span{padding:7px 9px;cursor:pointer;font-size:17px;white-space:nowrap;flex:none}
#emoPanel .et span:first-child{font-size:12px;font-weight:600;color:#bd1d63;align-self:center}
#emoPanel .et span.on{background:#fff;box-shadow:inset 0 -2px #bd1d63}
#emoPanel .eg{display:grid;grid-template-columns:repeat(8,1fr);height:220px;overflow-y:auto;padding:6px}
#emoPanel .eg.big{grid-template-columns:repeat(5,1fr)}
#emoPanel .eg span{font-size:22px;text-align:center;padding:4px 0;cursor:pointer;border-radius:6px}
#emoPanel .eg.big span{font-size:36px}
#emoPanel .eg span:hover{background:#f2f2f5}
#emoPanel .eg p{grid-column:1/-1;color:#999;font-size:12px;text-align:center;padding:30px 0}
#menu{position:fixed;z-index:45;background:#fff;border:1px solid #d6d6dc;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.2);min-width:190px;padding:6px;display:flex;flex-direction:column}
#menu .mq{display:flex;justify-content:space-between;padding:2px 2px 6px;border-bottom:1px solid #eee;margin-bottom:4px}
#menu .mq span{font-size:21px;cursor:pointer;padding:2px 4px;border-radius:6px}
#menu .mq span.on{background:#fdeef4}
#menu button{text-align:left;padding:8px 10px;border-radius:6px;font-size:13px}
#menu button:hover{background:#f3f3f6}
#menu .dg{color:#d33}
@media (hover:none){#list [data-mid]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}}
.c-msg .cb .txt{line-height:1.55}
.c-box .pb{margin-right:2px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#333;color:#fff;padding:8px 14px;border-radius:6px;font-size:12px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:.95}

<script>
function showErr(msg) {
  var el = document.getElementById('err');
  if (!el) { el = document.createElement('div'); el.id = 'err'; el.onclick = function () { el.remove(); }; document.body.appendChild(el); }
  el.textContent = '오류: ' + msg + ' (' + (navigator.userAgent.match(/OS [\d_]+|Chrome\/\d+|Version\/[\d.]+/g) || []).join(' ') + ')';
}
window.addEventListener('error', function (e) { showErr(e.message || '알 수 없는 오류'); });
window.addEventListener('unhandledrejection', function (e) { showErr(String((e.reason && e.reason.message) || e.reason)); });

<script>
'use strict';
const RELAY = 'https://ntfy.sh';
const VAPID = 'BEMjM0sNxh41x0a6Lz3YaqkJ7AUhZefxsOQgw-at69i0fM1CybVBcj7-QQXf4N_tPCgFnOXdRbQ5jrSrr9Yg9Lc';   // ntfy.sh 웹 푸시 공개키
const MAX_BYTES = 2800;   // 암호화 후 ntfy 본문 한도(4096바이트) 안에 들도록

// ?p=xx 로 같은 브라우저에서 프로필을 나눠 쓸 수 있다(테스트용)
const P = new URLSearchParams(location.search).get('p') || '';
const K = k => 'wt' + P + '_' + k;
const load = (k, d) => { try { const v = localStorage.getItem(K(k)); return v ? JSON.parse(v) : d; } catch (_) { return d; } };
const save = (k, v) => { try { localStorage.setItem(K(k), JSON.stringify(v)); } catch (_) {} };

// 설정: {me, skin, autoHide, notify, rooms: [{id, name, pass, group}]}
let cfg = load('cfg', null);
if (cfg && !cfg.rooms) {   // 방 하나짜리 옛 설정 이어받기
  cfg = {me: cfg.me, skin: cfg.skin || 'msg', autoHide: !!cfg.autoHide, rooms: [{id: 'r_main', name: cfg.peer || '상대', pass: cfg.pass, group: false}]};
  save('cfg', cfg);
}
const R = {};   // 방 id → {pass, key, raw, topic, sk, msgs, seen, unread, nn(알림 받는 이름들)}
let es = null, status = '', quota = null;
let view = null, lastRoom = null, lastDecoy = null, mobileSide = false;
let chTab = 'chat', selNote = 0;   // 메신저형 왼쪽 목록: 대화 / 쪽지

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const hm = ts => { const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const ymd = ts => { const d = new Date(ts); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const dayLabel = ts => { const d = new Date(ts); return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 ${'일월화수목금토'[d.getDay()]}요일`; };
const COLORS = ['#5b7fd6', '#d6875b', '#4ea786', '#9b6bd1', '#d65b7f', '#5ba8d6'];
const colorOf = s => COLORS[[...s].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length];
const initial = s => (s.replace(/^.*\s/, '') || s).slice(0, 1);
const last = a => a[a.length - 1];
const mine = m => m.n === cfg.me;
const isRoom = v => !!v && v.indexOf('r_') === 0;
const room = id => cfg.rooms.find(r => r.id === id);
const cur = () => (isRoom(view) && R[view]) ? room(view) : null;
const totalUnread = () => Object.keys(R).reduce((a, id) => a + R[id].unread, 0);
const newId = () => 'r_' + Math.random().toString(36).slice(2, 9);
// 보낸 사람 표시: 단톡은 각자 이름, 1:1은 내가 정한 상대 표시 이름
const who = (rm, m) => mine(m) ? cfg.me : (rm.group ? (m.n || '?') : rm.name);
// 단톡 참여자(나 제외, 최근 말한 순)
function members(id) {
  const out = [];
  const ms = R[id] ? R[id].msgs : [];
  for (let i = ms.length - 1; i >= 0; i--) if (!mine(ms[i]) && ms[i].n && out.indexOf(ms[i].n) < 0) out.push(ms[i].n);
  return out;
}

function toast(t) {
  const el = $('#toast'); el.textContent = t; el.classList.add('show');
  clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('show'), 3000);
}

// ---------- 암호화 ----------
const te = new TextEncoder(), td = new TextDecoder();
const b64 = u8 => btoa(String.fromCharCode.apply(null, u8));
const ub64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const ub64u = s => ub64(s.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - s.length % 4) % 4));

async function derive(pass) {
  const base = await crypto.subtle.importKey('raw', te.encode(pass), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits(
    {name: 'PBKDF2', salt: te.encode('worktalk-v1'), iterations: 200000, hash: 'SHA-256'}, base, 512));
  const raw = bits.slice(0, 32);
  return {
    raw,
    key: await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt', 'decrypt']),
    topic: 'wt' + Array.from(bits.slice(32, 48), b => b.toString(16).padStart(2, '0')).join('')
  };
}
async function seal(key, obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name: 'AES-GCM', iv}, key, te.encode(JSON.stringify(obj))));
  return b64(iv) + '.' + b64(ct);
}
async function unseal(key, s) {
  try {
    const parts = s.split('.');
    const pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: ub64(parts[0])}, key, ub64(parts[1]));
    return JSON.parse(td.decode(pt));
  } catch (_) { return null; }
}
// 사람별 알림함 토픽: 방 토픽 + 이름의 해시 (방 암호를 아는 사람만 계산 가능)
async function inboxOf(id, name) {
  const h = new Uint8Array(await crypto.subtle.digest('SHA-256', te.encode(R[id].topic + '|inbox|' + name)));
  return 'wn' + Array.from(h.slice(0, 16), b => b.toString(16).padStart(2, '0')).join('');
}

// ---------- 송수신 ----------
function setStatus(s) { status = s; document.querySelectorAll('.dot').forEach(d => { d.className = 'dot ' + s; }); paintStatus(); }

// 설정 저장이 연결 중에 겹쳐도 꼬이지 않게 한 번에 하나씩
let connecting = Promise.resolve();
function connectAll() {
  connecting = connecting.then(doConnect, doConnect);
  return connecting;
}
async function doConnect() {
  if (es) { es.close(); es = null; }
  for (const id of Object.keys(R)) if (!room(id) || R[id].pass !== room(id).pass) delete R[id];
  for (const rm of cfg.rooms) {
    if (R[rm.id]) continue;
    const d = await derive(rm.pass);
    const sk = d.topic.slice(2, 10);
    const msgs = load('msgs_' + sk, []);
    R[rm.id] = {pass: rm.pass, key: d.key, raw: d.raw, topic: d.topic, sk, msgs, seen: new Set(msgs.map(m => m.id)), unread: 0, nn: load('nn_' + sk, []),
      ext: Object.assign({react: {}, del: {}, pin: null, read: {}}, load('ext_' + sk, {})), myRead: load('mr_' + sk, 0), divTs: 0};
  }
  if (!view || (isRoom(view) && !room(view))) view = cfg.rooms[0].id;
  if (isRoom(view)) lastRoom = view;
  const byTopic = {};
  cfg.rooms.forEach(rm => { byTopic[R[rm.id].topic] = rm.id; });
  setStatus('');
  es = new EventSource(`${RELAY}/${Object.keys(byTopic).join(',')}/sse?since=12h`);
  es.onopen = () => setStatus('on');
  es.onerror = () => setStatus('off');
  es.onmessage = e => onEvent(byTopic, e);
  refreshQuota();
  render();
  if (cfg.notify) refreshPush(false).catch(() => {});
}

async function onEvent(byTopic, e) {
  let d; try { d = JSON.parse(e.data); } catch (_) { return; }
  const id = byTopic[d.topic];
  if (d.event !== 'message' || !id || !R[id]) return;
  const r = R[id];
  if (r.seen.has(d.id)) return;
  const o = await unseal(r.key, d.message || '');
  if (!o || r.seen.has(d.id)) return;
  if (o.sys) { r.seen.add(d.id); applySys(id, o); return; }
  if (typeof o.t !== 'string') return;
  const m = {id: d.id, n: String(o.n || ''), t: o.t, ts: Number(o.ts) || d.time * 1000};
  if (o.re && typeof o.re.id === 'string') m.re = {id: o.re.id, n: String(o.re.n || ''), t: String(o.re.t || '').slice(0, 80)};
  if (o.img && d.attachment) Object.assign(m, {t: '사진', img: 1, u: d.attachment.url, x: d.attachment.expires * 1000, mime: o.mime});
  if (o.file && d.attachment) Object.assign(m, {t: '파일: ' + String(o.fname || ''), file: 1, fname: String(o.fname || '파일'), fsize: Number(o.fsize) || 0, u: d.attachment.url, x: d.attachment.expires * 1000, mime: o.mime});
  add(id, m);
  if (m.img || m.file) fetchPic(id, m);
}

// 방 안의 부가 신호: 공감·삭제·공지·읽음·알림 수신
function applySys(id, o) {
  const r = R[id], x = r.ext, n = String(o.n || '');
  if (o.sys === 'notify') return setNotifyName(id, n, o.on !== false);
  if (o.sys === 'react' && typeof o.id === 'string') {
    const k = x.react[o.id] || (x.react[o.id] = {});
    if (o.e) k[n] = String(o.e).slice(0, 16); else delete k[n];
  } else if (o.sys === 'del' && typeof o.id === 'string') {
    const m = r.msgs.find(z => z.id === o.id);
    if (m && m.n !== n) return;   // 보낸 사람만 지울 수 있다
    x.del[o.id] = 1;
  } else if (o.sys === 'pin') {
    x.pin = o.id ? {id: String(o.id), n, t: String(o.t || '').slice(0, 80)} : null;
  } else if (o.sys === 'read') {
    if (n === cfg.me || (x.read[n] || 0) >= o.ts) return;
    x.read[n] = Number(o.ts) || 0;
  } else return;
  save('ext_' + r.sk, x);
  if (view === id) renderList();
  paintSide();
}
async function sendSys(id, obj) {
  const r = R[id];
  const o = Object.assign({n: cfg.me, ts: Date.now()}, obj);
  applySys(id, o);
  try {
    const res = await fetch(`${RELAY}/${r.topic}`, {method: 'POST', body: await seal(r.key, o)});
    if (res.status === 429) toast('오늘 보낼 수 있는 양을 다 썼어요');
    refreshQuota();
  } catch (_) { toast('전송 실패 — 네트워크를 확인하세요'); }
}

// 읽음 표시: 방을 보고 있을 때 상대 메시지를 어디까지 읽었는지 몇 초 모아서 한 번 보낸다
const readTimers = {};
function markRead(id) {
  // PC는 창이 활성일 때만, 폰(터치)은 화면에 보이면 읽은 것으로
  const touch = window.matchMedia('(hover: none)').matches;
  if (!cfg || cfg.readRcpt === false || view !== id || mobileSide || document.hidden || (!touch && !document.hasFocus())) return;
  const r = R[id];
  let lastOther = 0;
  for (let i = r.msgs.length - 1; i >= 0; i--) if (!mine(r.msgs[i])) { lastOther = r.msgs[i].ts; break; }
  if (lastOther <= r.myRead) return;
  r.myRead = lastOther;
  save('mr_' + r.sk, lastOther);
  clearTimeout(readTimers[id]);
  readTimers[id] = setTimeout(() => sendSys(id, {sys: 'read', ts: r.myRead}), 4000);
}

function setNotifyName(id, n, on) {
  const r = R[id];
  if (!n || n === cfg.me) return;
  const i = r.nn.indexOf(n);
  if (on && i < 0) r.nn.push(n);
  else if (!on && i >= 0) r.nn.splice(i, 1);
  else return;
  save('nn_' + r.sk, r.nn);
}

function add(id, m) {
  const r = R[id];
  if (r.seen.has(m.id)) return;
  r.seen.add(m.id);
  r.msgs.push(m);
  r.msgs.sort((a, b) => a.ts - b.ts);
  if (r.msgs.length > 3000) r.msgs = r.msgs.slice(-3000);
  save('msgs_' + r.sk, r.msgs);
  if (!mine(m) && (view !== id || mobileSide || document.hidden)) r.unread++;
  if (view === id) renderList();
  paintSide(); paintTitle();
}

// 알림을 켠 상대에게 짧은 알림 신호를 보낸다(상대 알림함 토픽으로)
async function ping(id, text) {
  const r = R[id];
  for (const n of r.nn) {
    if (n === cfg.me) continue;
    try {
      await fetch(`${RELAY}/${await inboxOf(id, n)}`, {method: 'POST', body: await seal(r.key, {n: cfg.me, t: text.slice(0, 100), ts: Date.now()})});
    } catch (_) {}
  }
}

async function send(text) {
  text = text.trim();
  const rm = cur();
  if (!rm) return true;   // 위장 화면에서 친 내용은 보내지 않고 지우기만
  if (!text) return false;
  const r = R[rm.id];
  const payload = {n: cfg.me, t: text, ts: Date.now()};
  if (replyTo) payload.re = replyTo;
  if (te.encode(JSON.stringify(payload)).length > MAX_BYTES) { toast('메시지가 너무 길어요. 나눠서 보내주세요.'); return false; }
  try {
    const res = await fetch(`${RELAY}/${r.topic}`, {method: 'POST', body: await seal(r.key, payload)});
    if (res.status === 429) { toast('오늘 보낼 수 있는 양을 다 썼어요 (하루 250건)'); return false; }
    if (!res.ok) throw new Error(res.status);
    const d = await res.json();
    const m = {id: d.id, n: payload.n, t: payload.t, ts: payload.ts};
    if (payload.re) m.re = payload.re;
    setReply(null);
    add(rm.id, m);
    ping(rm.id, text);
    recentEmoji(text);
    refreshQuota();
    return true;
  } catch (_) { toast('전송 실패 — 네트워크를 확인하세요'); return false; }
}

// ---------- 사진 ----------
// 사진은 방 키로 암호화한 바이트를 ntfy 첨부로 올린다(서버 보관 3시간). 받은 사진은 기기의 IndexedDB에 보관.
const PIC_MAX = 1.9 * 1024 * 1024;   // ntfy 익명 첨부 한도 2MB
const picUrls = new Map(), picBusy = new Set();
const dbs = {};
function openDb(name) {
  if (!dbs[name]) dbs[name] = new Promise((res, rej) => {
    const r = indexedDB.open(name, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(name === 'wt_push' ? 'k' : 'p');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbs[name];
}
async function idbGet(name, store, k) {
  try {
    const db = await openDb(name);
    return await new Promise(res => { const q = db.transaction(store).objectStore(store).get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); });
  } catch (_) { return null; }
}
async function idbPut(name, store, k, v) {
  try {
    const db = await openDb(name);
    await new Promise(res => { const t = db.transaction(store, 'readwrite'); t.objectStore(store).put(v, k); t.oncomplete = t.onerror = () => res(); });
  } catch (_) {}
}
const PICDB = 'wt' + P + '_pics';
const picTag = id => `<img class="pic" data-pic="${esc(id)}" alt="사진">`;

async function fetchPic(id, m) {
  if (picBusy.has(m.id) || !m.u || !R[id]) return;
  picBusy.add(m.id);
  try {
    const buf = new Uint8Array(await (await fetch(m.u)).arrayBuffer());
    const pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: buf.slice(0, 12)}, R[id].key, buf.slice(12));
    const blob = new Blob([pt], {type: m.mime || 'image/jpeg'});
    await idbPut(PICDB, 'p', m.id, blob);
    picUrls.set(m.id, URL.createObjectURL(blob));
  } catch (_) {}
  picBusy.delete(m.id);
  fillPics();
}
async function fillPics() {
  const rm = cur();
  for (const el of document.querySelectorAll('img.pic[data-pic]:not([src])')) {
    const pid = el.dataset.pic;
    if (!picUrls.has(pid)) {
      const blob = await idbGet(PICDB, 'p', pid);
      if (blob) picUrls.set(pid, URL.createObjectURL(blob));
    }
    if (picUrls.has(pid)) { el.src = picUrls.get(pid); continue; }
    const m = rm && R[rm.id].msgs.find(x => x.id === pid);
    if (m && m.u && Date.now() < m.x) { el.alt = '사진 받는 중…'; fetchPic(rm.id, m); }
    else el.replaceWith(Object.assign(document.createElement('span'), {className: 'pic-gone', textContent: '사진 (보관 기간이 지났어요)'}));
  }
}

function loadImage(file) {
  if (window.createImageBitmap) return createImageBitmap(file);
  return new Promise((res, rej) => {   // 옛 사파리
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = rej;
    im.src = URL.createObjectURL(file);
  });
}
async function shrink(file) {
  if (file.type === 'image/gif' && file.size <= PIC_MAX) return file;
  const bmp = await loadImage(file);
  const s = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const cv = Object.assign(document.createElement('canvas'), {width: Math.round(bmp.width * s), height: Math.round(bmp.height * s)});
  cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
  for (const q of [0.82, 0.7, 0.55, 0.4]) {
    const b = await new Promise(r => cv.toBlob(r, 'image/jpeg', q));
    if (b && b.size <= PIC_MAX) return b;
  }
  throw new Error('too big');
}

// 사진은 줄여서, 그 밖의 파일은 그대로(2MB까지) 보낸다
async function sendPic(file) {
  const rm = cur();
  if (!rm || !file) return;
  const r = R[rm.id];
  const isImg = /^image\/(jpeg|png|gif|webp|heic|heif|bmp)/.test(file.type);
  if (!isImg && file.size > PIC_MAX) { toast('파일은 2MB까지 보낼 수 있어요'); return; }
  toast(isImg ? '사진 보내는 중…' : '파일 보내는 중…');
  try {
    const blob = isImg ? await shrink(file) : file;
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({name: 'AES-GCM', iv}, r.key, await blob.arrayBuffer()));
    const body = new Uint8Array(12 + ct.length); body.set(iv); body.set(ct, 12);
    const mime = blob.type || 'application/octet-stream';
    const payload = isImg ? {n: cfg.me, t: '', img: 1, mime, ts: Date.now()}
                          : {n: cfg.me, t: '', file: 1, fname: file.name.slice(0, 80), fsize: file.size, mime, ts: Date.now()};
    const res = await fetch(`${RELAY}/${r.topic}`, {method: 'PUT', body, headers: {'Filename': 'p.bin', 'X-Message': await seal(r.key, payload)}});
    if (res.status === 429) { toast('오늘 보낼 수 있는 양을 다 썼어요'); return; }
    if (!res.ok) throw new Error(res.status);
    const d = await res.json();
    await idbPut(PICDB, 'p', d.id, blob);
    if (isImg) picUrls.set(d.id, URL.createObjectURL(blob));
    const at = d.attachment || {};
    const m = {id: d.id, n: cfg.me, u: at.url, x: (at.expires || 0) * 1000, mime, ts: payload.ts};
    Object.assign(m, isImg ? {t: '사진', img: 1} : {t: '파일: ' + payload.fname, file: 1, fname: payload.fname, fsize: payload.fsize});
    add(rm.id, m);
    ping(rm.id, isImg ? '' : m.t);
    refreshQuota();
    toast(isImg ? '사진을 보냈어요' : '파일을 보냈어요');
  } catch (e) { toast(e.message === 'too big' ? '사진이 너무 커요' : '전송 실패 — 네트워크를 확인하세요'); }
}
// 받은 파일 저장(기기에 보관된 것 → 없으면 서버에서 받아 복호화)
async function saveFile(rid, mid) {
  const m = R[rid] && R[rid].msgs.find(z => z.id === mid);

  const a = Object.assign(document.createElement('a'), {href: URL.createObjectURL(blob), download: m.fname || 'file'});
  document.body.appendChild(a); a.click(); a.remove();
}

const linkify = s => esc(s).replace(/https?:\/\/[^\s<]+/g, u => `<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
const EMO_RE = /\p{Extended_Pictographic}(?:️|‍\p{Extended_Pictographic}|\p{Emoji_Modifier})*️?/gu;
// 이모지만 1~3개면 이모티콘처럼 크게
function isBig(t) {
  const s = (t || '').replace(/\s/g, '');
  const em = s.match(EMO_RE);
  return !!em && em.length <= 3 && em.join('') === s;
}
const kb = n => n < 1024 * 1024 ? Math.max(1, Math.round(n / 1024)) + 'KB' : (n / 1048576).toFixed(1) + 'MB';
const isDel = (rid, m) => !!R[rid].ext.del[m.id];
function prevOf(rid, m) {
  if (!m) return '';
  if (isDel(rid, m)) return '삭제된 메시지입니다.';
  return m.img ? '사진' : (m.t || '').split('\n')[0];
}
// 말풍선 안쪽 내용 → {kind, html}
function bodyOf(rm, m) {
  if (isDel(rm.id, m)) return {kind: 'del', html: '<span class="gone">삭제된 메시지입니다.</span>'};
  let q = '';
  if (m.re) q = `<div class="quote" data-jump="${esc(m.re.id)}"><b>${esc(m.re.n === cfg.me ? cfg.me : nameOnly(rm.group ? m.re.n : rm.name))}</b><span>${esc(m.re.t)}</span></div>`;
  if (m.img) return {kind: 'img', html: q + picTag(m.id)};
  if (m.file) return {kind: 'file', html: q + `<span class="fcard" data-file="${esc(m.id)}"><i>📄</i><span><b>${esc(m.fname)}</b><small>${kb(m.fsize)} · 눌러서 저장</small></span></span>`};
  if (!q && isBig(m.t)) return {kind: 'big', html: `<span class="bigemo">${esc(m.t)}</span>`};
  return {kind: 'txt', html: q + `<span class="txt">${linkify(m.t)}</span>`};
}
function reactHTML(rm, m) {
  const k = R[rm.id].ext.react[m.id];
  if (!k || isDel(rm.id, m)) return '';
  const g = {};
  Object.keys(k).forEach(n => { (g[k[n]] = g[k[n]] || []).push(n); });
  const es = Object.keys(g);
  if (!es.length) return '';
  return `<div class="reacts">${es.map(e => `<span class="rchip${g[e].indexOf(cfg.me) >= 0 ? ' on' : ''}" data-react="${esc(m.id)}" data-e="${esc(e)}" title="${esc(g[e].join(', '))}">${e} ${g[e].length}</span>`).join('')}</div>`;
}
// 내 메시지를 아직 안 읽은 사람 수(노란 숫자)
function unreadCount(rm, m) {
  if (!mine(m) || isDel(rm.id, m)) return 0;
  const rd = R[rm.id].ext.read;
  const ppl = members(rm.id);
  Object.keys(rd).forEach(n => { if (n !== cfg.me && ppl.indexOf(n) < 0) ppl.push(n); });
  if (!ppl.length) return rm.group ? 0 : 1;
  return ppl.filter(n => (rd[n] || 0) < m.ts).length;
}

let searchQ = '', searchIdx = 0, searchJump = false;
function toggleSearch() {
  const bar = $('#srchBar');
  if (!bar) return;
  const show = bar.classList.contains('hidden');
  bar.classList.toggle('hidden', !show);
  if (show) bar.querySelector('input').focus();

function paintSearch(jump) {
  const list = $('#list'), bar = $('#srchBar');
  if (!list || !bar) return;
  const marks = [];
  if (searchQ) {
    const q = searchQ.toLowerCase();
    list.querySelectorAll('.txt').forEach(el => {
      if (el.querySelector('.txt')) return;   // 안쪽 글자만(겹쳐 칠하지 않게)
      const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
      const nodes = [];
      while (w.nextNode()) nodes.push(w.currentNode);
      nodes.forEach(nd => {
        const s = nd.nodeValue, low = s.toLowerCase();
        let i = low.indexOf(q);
        if (i < 0) return;
        const frag = document.createDocumentFragment();
        let p = 0;
        while (i >= 0) {
          frag.appendChild(document.createTextNode(s.slice(p, i)));
          const mk = document.createElement('mark');
          mk.textContent = s.slice(i, i + q.length);
          frag.appendChild(mk); marks.push(mk);
          p = i + q.length; i = low.indexOf(q, p);
        }
        frag.appendChild(document.createTextNode(s.slice(p)));
        nd.parentNode.replaceChild(frag, nd);
      });
    });
  }
  bar.querySelector('.cnt').textContent = searchQ ? (marks.length ? `${Math.min(searchIdx, marks.length - 1) + 1}/${marks.length}` : '없음') : '';
  if (marks.length && jump) {
    searchIdx = ((searchIdx % marks.length) + marks.length) % marks.length;
    const mk = marks[marks.length - 1 - searchIdx];   // 최근 것부터
    mk.classList.add('cur');
    mk.scrollIntoView({block: 'center'});
    bar.querySelector('.cnt').textContent = `${searchIdx + 1}/${marks.length}`;
  }
}

// ---------- 알림(웹 푸시) ----------
// 알림을 켠 기기는 방마다 '내 알림함' 토픽을 ntfy 웹 푸시에 등록하고, 방에 알림 수신 신호(sys:notify)를 보낸다.
// 상대는 메시지를 보낼 때 그 알림함으로 짧은 신호를 함께 보낸다 → 내가 보낸 메시지는 나에게 알림이 오지 않는다.
const pushOK = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const standalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const pushOn = () => !!(cfg && cfg.notify && pushOK() && Notification.permission === 'granted');

async function enablePush() {   // 버튼 클릭 안에서 바로 호출해야 함(사파리)
  if (!cfg || !Object.keys(R).length) { toast('먼저 저장해 주세요'); return; }
  if (!pushOK()) {
    toast(isIOS && !standalone() ? '공유 버튼 → 홈 화면에 추가 후, 홈 화면 아이콘으로 열어서 눌러주세요' : '이 브라우저는 알림을 지원하지 않아요');
    return;
  }
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') { toast('알림이 허용되지 않았어요. 설정에서 알림을 허용해 주세요'); return; }
  try {
    await navigator.serviceWorker.register('sw.js');
    cfg.notify = true; save('cfg', cfg);
    await refreshPush(true);
    toast('알림을 켰어요');
  } catch (e) { cfg.notify = false; save('cfg', cfg); toast('알림 설정 실패: ' + (e.message || e)); }
  paintNtf();
}

async function refreshPush(announce) {
  if (!pushOn()) return;
  await navigator.serviceWorker.register('sw.js');
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) sub = await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: ub64u(VAPID)});
  const j = sub.toJSON();
  const rooms = [];
  for (const rm of cfg.rooms) rooms.push({inbox: await inboxOf(rm.id, cfg.me), key: R[rm.id].raw, name: rm.name, group: !!rm.group});
  await idbPut('wt_push', 'k', 'push', {rooms});
  const res = await fetch(`${RELAY}/v1/webpush`, {method: 'POST', body: JSON.stringify({endpoint: j.endpoint, auth: j.keys.auth, p256dh: j.keys.p256dh, topics: rooms.map(x => x.inbox)})});
  if (!res.ok) throw new Error('webpush ' + res.status);
  for (const rm of cfg.rooms) {   // 8시간마다 "나 알림 받아요" 신호(서버 기록은 12시간만 남으므로)
    const r = R[rm.id], k = 'ann_' + r.sk;
    if (!announce && Date.now() - load(k, 0) < 8 * 3600e3) continue;
    try {
      await fetch(`${RELAY}/${r.topic}`, {method: 'POST', body: await seal(r.key, {n: cfg.me, sys: 'notify', on: true, ts: Date.now()})});
      save(k, Date.now());
    } catch (_) {}
  }
}

async function disablePush() {
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    const sub = reg && await reg.pushManager.getSubscription();
    if (sub) {
      await fetch(`${RELAY}/v1/webpush`, {method: 'DELETE', body: JSON.stringify({endpoint: sub.endpoint})});
      await sub.unsubscribe();
    }
  } catch (_) {}
  for (const rm of cfg.rooms) {
    const r = R[rm.id];
    try { await fetch(`${RELAY}/${r.topic}`, {method: 'POST', body: await seal(r.key, {n: cfg.me, sys: 'notify', on: false, ts: Date.now()})}); } catch (_) {}
    save('ann_' + r.sk, 0);
  }
  cfg.notify = false; save('cfg', cfg);
  toast('알림을 껐어요');
  paintNtf();
}

          av: c.grp ? grpAv(c.grp) : avOf(c.name)};

        <div class="meta"><div class="l1"><b>From ${esc(r.f)}</b><small>${r.w}</small>${r.badge ? `<i class="badge">${r.badge}</i>` : ''}</div>

    list() {
      const rm = cur();

      if (!rm) {
        src = CHC[view].lines.map(l => ({me: l[0] === '나', n: l[0], t: l[1], x: l[2], day: '오늘'}));
        cell = r => `<div class="bw"><div class="ch-bub txt">${esc(r.x)}</div></div>`;
        meta = r => `<span class="mt"><time>${r.t}</time></span>`;
      } else {
        const R0 = R[rm.id], ms = R0.msgs;

        let divDone = false;
        src = ms.map(m => {
          const div = !divDone && R0.divTs && !mine(m) && m.ts >= R0.divTs;
          if (div) divDone = true;
          return {m, id: m.id, me: mine(m), n: nameOnly(who(rm, m)), t: chatTime(m.ts), day: chatDay(m.ts), div};
        });
        cell = r => { const b = bodyOf(rm, r.m); return `<div class="bw"><div class="ch-bub ${b.kind}">${b.html}</div>${reactHTML(rm, r.m)}</div>`; };
        meta = r => { const c = unreadCount(rm, r.m); return `<span class="mt">${c ? `<b class="rc">${c}</b>` : ''}<time>${r.t}</time></span>`; };
      }
      const mid = r => r.id ? ` data-mid="${esc(r.id)}"` : '';
      let out = '', day = '', i = 0;
      while (i < src.length) {
        const m = src[i];
        if (m.day !== day) { day = m.day; out += `<div class="ch-day"><span>${esc(day)}</span></div>`; }
        if (m.div) out += '<div class="ch-unread"><span>여기까지 읽었습니다</span></div>';
        let j = i + 1;
        while (j < src.length && src[j].me === m.me && src[j].n === m.n && src[j].day === day && !src[j].div) j++;
        const run = src.slice(i, j);
        if (m.me) out += run.map((r, k) => `<div class="ch-m${k ? '' : ' first'}"${mid(r)}>${meta(r)}${cell(r)}</div>`).join('');

          ${run.map(r => `<div class="row"${mid(r)}>${cell(r)}${meta(r)}</div>`).join('')}</div></div>`;
        i = j;
      }
      return out;
    }

      paintStatus();

    list() {
      const cols = ['', 'A', 'B', 'C', 'D', 'E', 'F'];
      const widths = [40, 48, 92, 60, 110, null, 120];
      const head = `<colgroup>${widths.map(w => `<col${w ? ` style="width:${w}px"` : ''}>`).join('')}</colgroup>
        <thead><tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>`;
      const rows = [];
      let r = 1;
      const rm = cur();
      if (rm) {
        const ms = R[rm.id].msgs;
        rows.push(`<tr class="hd"><th>${r++}</th><td>No</td><td>일자</td><td>시간</td><td>담당</td><td>내용</td><td>비고</td></tr>`);
        ms.forEach((m, i) => {
          const b = bodyOf(rm, m), c = unreadCount(rm, m), k = R[rm.id].ext.react[m.id];
          const note = (c ? `미확인 ${c}` : '') + (k && Object.keys(k).length ? ' ' + Object.keys(k).map(n => k[n]).join('') : '');
          rows.push(`<tr class="${mine(m) ? 'me' : ''}" data-mid="${esc(m.id)}"><th>${r++}</th><td class="ce">${i + 1}</td><td class="ce">${ymd(m.ts)}</td><td class="ce">${hm(m.ts)}</td>
          <td class="d">${esc(who(rm, m))}</td><td class="e">${b.html}</td><td>${esc(note)}</td></tr>`);
        });
        const sel = r;
        rows.push(`<tr><th>${r++}</th><td class="ce">${ms.length + 1}</td><td></td><td></td><td></td><td class="sel"></td><td></td></tr>`);
        this.selRow = sel;
      } else {
        const months = ['7월', '8월', '9월', '10월'];
        const data = [['이물', 14, 11, 16, 12], ['변질', 6, 9, 5, 7], ['포장불량', 8, 7, 10, 6], ['표시사항', 2, 1, 3, 2], ['기타', 4, 5, 3, 4]];
        rows.push(`<tr class="hd"><th>${r++}</th><td>No</td><td>구분</td>${months.map(m => `<td>${m}</td>`).join('')}</tr>`);
        data.forEach((d, i) => rows.push(`<tr><th>${r++}</th><td class="ce">${i + 1}</td><td>${d[0]}</td>${d.slice(1).map(v => `<td class="ri">${v}</td>`).join('')}</tr>`));
        const sum = j => data.reduce((a, d) => a + d[j], 0);
        rows.push(`<tr><th>${r++}</th><td></td><td><b>합계</b></td>${[1, 2, 3, 4].map(j => `<td class="ri"><b>${sum(j)}</b></td>`).join('')}</tr>`);
        this.selRow = null;
      }
      while (r <= 40) rows.push(`<tr><th>${r++}</th>${'<td></td>'.repeat(6)}</tr>`);
      return `<table>${head}${rows.join('')}</tbody></table>`;
    },
    after(list) {
      const ref = $('#ref'); if (ref) ref.textContent = this.selRow ? 'E' + this.selRow : 'A1';
      const sel = list.querySelector('td.sel');
      if (sel) list.scrollTop = Math.max(0, sel.offsetTop - list.clientHeight + 60);
    }
  }
};

// ---------- 설정 ----------
function roomRow(rm) {
  const div = document.createElement('div');
  div.className = 'rm';
  div.dataset.id = rm.id || newId();
  div.innerHTML = `<div class="rm1"><select class="rt"><option value="1">1:1</option><option value="g">단톡</option></select>
    <input class="rn" type="text" maxlength="30"><button class="rx" type="button" title="이 방 빼기">✕</button></div>
    <input class="rp" type="password" placeholder="방 암호 (상대와 똑같이)" autocomplete="new-password">`;
  const rt = div.querySelector('.rt'), rn = div.querySelector('.rn');
  rt.value = rm.group ? 'g' : '1';
  rn.value = rm.name || '';
  div.querySelector('.rp').value = rm.pass || '';
  const ph = () => { rn.placeholder = rt.value === 'g' ? '단톡방 이름 (예: 대학 친구들)' : '상대 표시 이름 (예: 김지은(품질관리팀))'; };
  rt.addEventListener('change', ph); ph();
  div.querySelector('.rx').addEventListener('click', () => div.remove());
  return div;
}
function paintNtf() {
  const t = $('#fNtfTxt'), b = $('#fNtf');
  if (pushOn()) { t.textContent = '켜짐 — 새 메시지가 오면 이 기기로 알림이 와요'; b.textContent = '알림 끄기'; return; }
  b.textContent = '알림 켜기';
  if (!pushOK() && isIOS && !standalone()) t.textContent = '아이폰은 공유 버튼 → "홈 화면에 추가" 후, 홈 화면 아이콘으로 열어야 켤 수 있어요';
  else if (!pushOK()) t.textContent = '이 브라우저는 알림을 지원하지 않아요';
  else t.textContent = '꺼짐';
}
function openSetup() {
  $('#fMe').value = cfg ? cfg.me : '';
  const box = $('#fRooms');
  box.innerHTML = '';
  (cfg ? cfg.rooms : [{}]).forEach(rm => box.appendChild(roomRow(rm)));
  $('#fSkin').value = cfg ? cfg.skin : 'msg';
  $('#fAuto').checked = !!(cfg && cfg.autoHide);
  $('#fRead').checked = !cfg || cfg.readRcpt !== false;
  $('#fCancel').classList.toggle('hidden', !cfg);
  $('#fClear').classList.toggle('hidden', !cfg);
  $('#fNtfBox').classList.toggle('hidden', !cfg);
  $('#fWarn').textContent = '';
  paintNtf();
  $('#setup').classList.remove('hidden');
  if (!cfg) $('#fMe').focus();
}
$('#fAdd').addEventListener('click', () => { const row = roomRow({}); $('#fRooms').appendChild(row); row.querySelector('.rn').focus(); });
$('#fCancel').addEventListener('click', () => $('#setup').classList.add('hidden'));
$('#fNtf').addEventListener('click', () => { if (pushOn()) disablePush(); else enablePush(); });
$('#fClear').addEventListener('click', () => {
  if (!confirm('이 기기에 저장된 모든 방의 대화 기록을 지울까요? (상대 기기에는 남아요)')) return;
  Object.keys(R).forEach(id => { R[id].msgs = []; R[id].seen = new Set(); save('msgs_' + R[id].sk, []); });
  $('#setup').classList.add('hidden'); render();
});
$('#fSave').addEventListener('click', async () => {
  const warn = t => { $('#fWarn').textContent = t; };
  const me = $('#fMe').value.trim();
  const rooms = Array.from(document.querySelectorAll('#fRooms .rm')).map(d => ({
    id: d.dataset.id, group: d.querySelector('.rt').value === 'g',
    name: d.querySelector('.rn').value.trim(), pass: d.querySelector('.rp').value
  }));
  if (!me) return warn('내 이름을 넣어주세요.');
  if (!rooms.length) return warn('대화방을 하나 이상 넣어주세요.');
  if (rooms.some(r => r.pass.length < 4)) return warn('방 암호는 4자 이상으로 넣어주세요.');
  if (new Set(rooms.map(r => r.pass)).size !== rooms.length) return warn('방마다 암호를 다르게 해주세요.');
  rooms.forEach(r => { if (!r.name) r.name = r.group ? '단톡방' : '상대'; });
  const old = cfg;
  cfg = {me, skin: $('#fSkin').value, autoHide: $('#fAuto').checked, readRcpt: $('#fRead').checked, notify: !!(old && old.notify), rooms};
  save('cfg', cfg);
  $('#fSave').disabled = true;
  try { await connectAll(); } finally { $('#fSave').disabled = false; }
  $('#setup').classList.add('hidden');
  if (cfg.notify) refreshPush(!old || old.me !== me || JSON.stringify(old.rooms) !== JSON.stringify(rooms)).catch(() => {});
});

// ---------- 키·창 이벤트 ----------
const closePops = () => { $('#emoPanel').classList.add('hidden'); $('#menu').classList.add('hidden'); };
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && cfg && $('#setup').classList.contains('hidden')) {
    e.preventDefault();
    closePops();
    if (!$('#viewer').classList.contains('hidden')) { $('#viewer').classList.add('hidden'); decoy(); return; }
    toggleDecoy();
  }
});
$('#picFile').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) sendPic(f); });
$('#anyFile').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) sendPic(f); });
$('#viewer').addEventListener('click', () => $('#viewer').classList.add('hidden'));
document.addEventListener('click', e => {
  const t = e.target;
  if (!t.closest) return;
  if (!t.closest('#emoPanel') && !t.closest('#menu')) closePops();
  const im = t.closest('img.pic[src]');
  if (im) { $('#viewer img').src = im.src; $('#viewer').classList.remove('hidden'); return; }
  const rc = t.closest('[data-react]');
  if (rc && cur()) {   // 공감 칩: 누르면 같은 공감 넣기/빼기
    const my = (R[view].ext.react[rc.dataset.react] || {})[cfg.me];
    sendSys(view, {sys: 'react', id: rc.dataset.react, e: my === rc.dataset.e ? '' : rc.dataset.e});
    return;
  }
  const q = t.closest('[data-jump]');
  if (q) { jumpTo(q.dataset.jump); return; }
  const fc = t.closest('[data-file]');
  if (fc && cur()) saveFile(view, fc.dataset.file);
});
// 메시지 메뉴: PC는 오른쪽 클릭, 폰은 길게 누르기
document.addEventListener('contextmenu', e => {
  const el = e.target.closest && e.target.closest('#list [data-mid]');
  if (!el || !cur() || (e.target.closest('a'))) return;
  e.preventDefault();
  openMenu(el.dataset.mid, e.clientX, e.clientY);
});
let pressT = null;
document.addEventListener('touchstart', e => {
  const el = e.target.closest && e.target.closest('#list [data-mid]');
  if (!el || !cur()) return;
  const tc = e.touches[0];
  pressT = setTimeout(() => { pressT = null; openMenu(el.dataset.mid, tc.clientX, tc.clientY); }, 500);
}, {passive: true});
['touchend', 'touchmove', 'touchcancel'].forEach(n => document.addEventListener(n, () => { if (pressT) { clearTimeout(pressT); pressT = null; } }, {passive: true}));
document.addEventListener('dragover', e => { if (cur()) e.preventDefault(); });
document.addEventListener('drop', e => {
  if (!cur()) return;
  e.preventDefault();
  const f = Array.from((e.dataTransfer && e.dataTransfer.files) || [])[0];
  if (f) sendPic(f);
});
window.addEventListener('blur', () => { if (cfg && cfg.autoHide && cur()) decoy(); });
window.addEventListener('focus', () => { if (cur()) markRead(view); });
document.addEventListener('visibilitychange', () => {
  if (cfg && !document.hidden && cur() && !mobileSide) { R[view].unread = 0; paintSide(); paintTitle(); markRead(view); }
});

(async () => {
  if (!window.isSecureContext || !window.crypto || !crypto.subtle) { showErr('보안 연결(https)에서 열어주세요'); return; }
  if (!cfg) { openSetup(); return; }
  await connectAll();
})();
</script>
